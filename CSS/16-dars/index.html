<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <section>
            <div class="box">
                <h2 class="title">CARD</h2>
                <img width="430" src="./image.png" alt="CARD" class="card__image">
                <div class="option">
                    <div class="option__r">
                        <img width="50" height="50" src="./lock.svg" alt="LOCK" class="option__img">
                        <span class="option__desc">
                            <strong class="option__name">Lock card</strong>
                            <p class="option__description">You can unlock it later</p>
                        </span>
                    </div>
                    <div class="checkbox__sect">
                        <input hidden class="input" type="checkbox" name="" id="check">
                        <label class="check" for="check">
                            <span class="check-circle"></span>
                        </label>
                    </div>
                </div>
                <div class="option2">
                    <div class="option2__r">
                        <img width="50" height="50" src="./plane.svg" alt="LOCK" class="option__img">
                        <span class="option2__desc">
                            <strong class="option2__name">Lock card</strong>
                            <p class="option2__description">You can unlock it later</p>
                        </span>
                    </div>
                    <div class="checkbox2__sect">
                        <input hidden class="input2" type="checkbox" name="" id="check2">
                        <label class="check2" for="check2">
                            <span class="check2-circle"></span>
                        </label>
                    </div>
                </div>
                <div class="option3">
                    <div class="option3__r">
                        <img width="50" height="50" src="./laptop.svg" alt="LOCK" class="option3__img">
                        <span class="option3__desc">
                            <strong class="option3__name">Lock card</strong>
                            <p class="option3__description">You can unlock it later</p>
                        </span>
                    </div>
                    <div class="checkbox3__sect">
                        <input hidden class="input3" type="checkbox" name="" id="check3">
                        <label class="check3" for="check3">
                            <span class="check3-circle"></span>
                        </label>
                    </div>
                </div>
                <div class="option4">
                    <div class="option4__r">
                        <img width="50" height="50" src="./atm.svg" alt="LOCK" class="option4__img">
                        <span class="option4__desc">
                            <strong class="option4__name">Lock card</strong>
                            <p class="option4__description">You can unlock it later</p>
                        </span>
                    </div>
                    <div class="checkbox4__sect">
                        <input hidden class="input4" type="checkbox" name="" id="check4">
                        <label class="check4" for="check4">
                            <span class="check4-circle"></span>
                        </label>
                    </div>
                </div>
            </div>
        </section>
        <section class="button__section">
            <label class="button" for="button">CHOOSE FILE</label>
            <input type="file" class="button visually-hidden" id="button">
        </section>
    </main>
</body>

</html>
