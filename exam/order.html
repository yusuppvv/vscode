<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Order</title>
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/512/721/721335.png">
</head>

<body>
    <header>
        <ul>
            <li><a href="./iphone.html">iPhone</a></li>
            <li><a href="./macbook.html">Macbook</a></li>
            <li><a href="./iwatch.html">iWatch</a></li>
            <li><a href="./order.html">Buyurtma berish</a></li>
            <li><a href="./table.html">Table</a></li>
        </ul>
    </header>

    <main>
        <section>
            <center>
                <h2>Apple mahsulotlariga buyurtma berish</h2>
            </center>
        </section>

        <section>
            <form autocomplete="on" action="https://echo.htmlacademy.ru" method="POST">
                <label for="user-name">Ismingizni kiriting:</label>
                <input required type="text" name="user_name" id="user-name"><br><br>
                <label for="user-email">Emailingizni kiriting</label>
                <input required type="email" name="user_email" id="user-email"><br><br>
                <label for="user-passport">Passportingizni kiriting</label>
                <input required type="file" name="user_passport" id="user-passport"><br><br>
                <label for="user-data">Burutma kunini kiriting</label>
                <input type="date" name="user_dara" id="user-data"><br>
                <h3>Jinsingizni tanlang</h3>
                <label>
                    <input type="radio" name="user-gender" value="men">
                    Erkak
                    <input type="radio" name="user-gender" value="woman">
                    Ayol
                </label>
                <h3>Qaysi mahsulotni zakaz qimoqchisiz</h3>
                <label>
                    <input type="radio" name="user-macbook" value="macbook">
                    Macbook
                    <input type="radio" name="user-iphone" value="iphone">
                    iPhone
                    <input type="radio" name="user-iwatch" value="iwatch">
                    iWatch
                </label><br><br>
                <label for="user-color">Mahsulot rangi</label>
                <input type="color" name="user_color" id="user-color"><br><br>
                <label for="user-review">Mahsulot sizga qanchalik yoqdi</label>
                <input type="range" name="user_review" id="user-review"><br><br>
                <label for="user-text">Nega bu mahsulotni tanladingiz?</label><br>
                <textarea cols="40" rows="7" name="user-text" id="user-text" placeholder="Nimadir..."></textarea><br>
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>
</body>

</html>
